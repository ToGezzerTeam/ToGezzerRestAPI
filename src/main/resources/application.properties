spring.application.name=restapi

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/togezzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ
togezzer.rabbitmq.message-exchange=${RABBITMQ_MESSAGE_EXCHANGE:message.exchange}
togezzer.rabbitmq.queue.chat-sauvegarde=${RABBITMQ_QUEUE_CHAT_SAUVEGARDE:queue-message-chat-sauvegarde}
togezzer.rabbitmq.exchanges.chat-sauvegarde.dlq=${RABBITMQ_EXCHANGE_CHAT_SAUVEGARDE_DLQ:exchange-message.dlq}
togezzer.rabbitmq.queue.live-chat-service=${RABBITMQ_QUEUE_LIVE_CHAT:queue-message-live-chat-service}
togezzer.rabbitmq.routing-key.chat-sauvegarde=${RABBITMQ_ROUTING_CHAT_SAUVEGARDE:routing-message-chat-sauvegarde}
togezzer.rabbitmq.routing-key.live-chat-service=${RABBITMQ_ROUTING_LIVE_CHAT:routing-message-live-chat-service}
togezzer.rabbitmq.routing-keys.chat-sauvegarde.dlq=${RABBITMQ_ROUTING_CHAT_SAUVEGARDE_DLQ:routing-message-chat-sauvegarde.dlq}

# Services
togezzer.chat-sauvegarde.base-url=${CHAT_SAUVEGARDE_BASE_URL:http://localhost:8081}

# Minio
togezzer.minio.base-url=${MINIO_BASE_URL:http://localhost:9000}
togezzer.minio.user=${MINIO_USER:minioadmin}
togezzer.minio.password=${MINIO_PASSWORD:minioadmin}

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
togezzer.jwt.secret=${JWT_SECRET:dev-secret-dev-secret-dev-secret-32chars}

# CORS
togezzer.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}